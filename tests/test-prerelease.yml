name: Test prerelease mode in noop
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config and origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a bare repo under GITHUB_WORKSPACE so it's reachable inside the Docker container
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags || true
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          config_file: "tests/fixtures/psr-config/pyproject.toml"
          no_operation_mode: "true"
          prerelease: "true"
          prerelease_token: "alpha"
          force: "patch"
          commit: "false"
          tag: "false"
          push: "false"
          changelog: "false"
          vcs_release: "false"
          build: "false"
          verbosity: "1"

      - name: Assert prerelease outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
          IS_PRERELEASE: ${{ steps.action.outputs.is_prerelease }}
          RELEASED: ${{ steps.action.outputs.released }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          echo "is_prerelease: $IS_PRERELEASE"
          echo "released: $RELEASED"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VERSION" ]; then
              echo "FAIL: action succeeded but version output is empty"
              exit 1
            fi
            # When prerelease=true, is_prerelease should be true
            if [ "$IS_PRERELEASE" != "true" ]; then
              echo "FAIL: expected is_prerelease=true for a prerelease"
              exit 1
            fi
            # Version should contain the prerelease token "alpha"
            if ! echo "$VERSION" | grep -q "alpha"; then
              echo "FAIL: expected version to contain 'alpha' prerelease token, got: $VERSION"
              exit 1
            fi
            echo "PASS: got version='$VERSION' is_prerelease='$IS_PRERELEASE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or PSR config issue — expected in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
