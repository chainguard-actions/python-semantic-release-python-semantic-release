name: Test invalid force input validation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config and origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a bare repo under GITHUB_WORKSPACE so it's reachable inside the Docker container
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags || true
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          config_file: "tests/fixtures/psr-config/pyproject.toml"
          no_operation_mode: "true"
          force: "invalid-level"
          commit: "false"
          tag: "false"
          push: "false"
          changelog: "false"
          vcs_release: "false"
          build: "false"
          verbosity: "0"

      - name: Assert action handled invalid force value
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          # The action.sh prints an error for invalid force but does NOT exit 1,
          # so it continues running semantic-release without the --force flag.
          # The action may succeed (version determined) or fail (PSR/API issue).
          # Either outcome is acceptable — we just verify it doesn't hang.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran (invalid force was ignored, PSR ran without --force flag)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or PSR config issue — expected in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
